    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install --upgrade pip numpy scipy pytest pyyaml soundfile pytest-xdist
      - run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: record the runner (cpus, memory, versions, commit)
        run: |
          python3 - <<'EOF' | tee "$RUNNER_TEMP/env.txt"
          import os, subprocess, sys

          def cmd(c):
              r = subprocess.run(c, shell=True, capture_output=True, text=True)
              return r.stdout.strip().replace("\n", " | ") or f"(exit {r.returncode}, no output)"

          print("date_utc", cmd("date -u +%FT%TZ"))
          print("head", cmd("git rev-parse HEAD"))
          print("tools_tree", cmd("git rev-parse HEAD:tools"))
          print("python", sys.version.split()[0])
          print("cpu_count", os.cpu_count(), "affinity", len(os.sched_getaffinity(0)))
          print("cpu_max", cmd("cat /sys/fs/cgroup/cpu.max"))
          print("lscpu", cmd("lscpu | grep -E '^CPU\\(s\\)|^Model name|^Thread|^Core|^Socket'"))
          print("meminfo", cmd("grep -E 'MemTotal|MemAvailable' /proc/meminfo"))
          print("packages", cmd("python -c \"import importlib.metadata as m; print(' '.join(n + ' ' + m.version(n) for n in ['pytest', 'pytest-xdist', 'execnet', 'numpy', 'scipy', 'soundfile', 'PyYAML']))\""))
          print("iverilog", cmd("iverilog -V 2>/dev/null | head -1"))
          EOF
      - name: every tools/ test, split across two shards (shard ${{ matrix.shard.label }}, repeat ${{ matrix.repeat }})
        id: pytest
        continue-on-error: true
        env:
          FILES: ${{ matrix.shard.files }}
        run: >-
          python tools/mem_peak.py --interval 0.5 --out "$RUNNER_TEMP/mem.json" --
          python tools/run_with_rss.py --
          python -m pytest $FILES -q --durations=0
          --junitxml="$RUNNER_TEMP/junit.xml" -rX
          > "$RUNNER_TEMP/pytest.log" 2>&1
      - name: a fresh by-directory collection of the same checkout, saved
        if: always()
        run: >-
          python -m pytest tools/ -q --collect-only -p no:cacheprovider
          > "$RUNNER_TEMP/collect.txt" 2> "$RUNNER_TEMP/collect.err"
      - name: the wrapper records, pytest's summary line, the collection count
        if: always()
        run: |
          python3 - <<'EOF'
          import os, pathlib, re
          tmp = pathlib.Path(os.environ["RUNNER_TEMP"])
          for name in ("pytest.log", "collect.txt"):
              p = tmp / name
              print(f"--- {name}: {'absent' if not p.exists() else str(p.stat().st_size) + ' bytes'} ---")
              if not p.exists():
                  continue
              text = p.read_text(errors="replace")
              lines = text.splitlines()
              if name == "pytest.log":
                  for l in lines:
                      if l.startswith(("[mem]", "[rss]")):
                          print(l)
                  summary = [l for l in lines if re.search(r"\d+ passed", l) and " in " in l]
                  print("summary:", summary[-1] if summary else "(no summary line)")
                  print("\n".join(lines[-6:]))
              else:
                  print(lines[-1] if lines else "(empty)")
          EOF
      - name: upload the run's records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xdist-${{ matrix.candidate.label }}-r${{ matrix.repeat }}
          path: |
            ${{ runner.temp }}/junit.xml
            ${{ runner.temp }}/pytest.log
            ${{ runner.temp }}/collect.txt
            ${{ runner.temp }}/collect.err
            ${{ runner.temp }}/mem.json
            ${{ runner.temp }}/env.txt
          if-no-files-found: error
      - name: the job is red if pytest was (its records are uploaded either way)
        if: always() && steps.pytest.outcome != 'success'
        run: |
          echo "pytest step outcome: ${{ steps.pytest.outcome }}"
          exit 1
