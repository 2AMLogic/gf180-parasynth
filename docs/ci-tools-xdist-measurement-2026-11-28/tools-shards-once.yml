# ONE-OFF measurement for issue 1947, second mechanism: the SAME commit and
# the SAME steps as tools-xdist-once.yml, but the directory is split into two
# shards that run on two separate runners instead of N workers on one. Each
# shard names its files on the pytest command line (by NAME, not by directory),
# so a file missing from both lists would vanish silently -- which is exactly
# what the collection-union check across the two junit files exists to catch.
#
# Lives only on branch throwaway/tools-xdist-1947-shards; never merged, deleted
# after the runs. The two file lists were built once, from the single-process
# run n1-r2 of the first measurement: the 241 files `pytest --collect-only
# tools/` lists, greedily assigned to the lighter shard by that run's summed
# per-test seconds. 120 files / 3233 tests / 1513 s and 121 / 3445 / 1513 s.
