# The expensive checks, nightly.
#
# Per-push CI runs what is fast. The checks that would actually have caught
# this project's failures are the slow ones: the full 255,060-frame voice run,
# the 348,554-sample drum run, and every injected-defect control. Those ran
# only when somebody remembered, which is the same as not running.
#
# WHAT CANNOT RUN HERE, and why it is not silently omitted: the reference
# comparison against Surge XT, Arturia Mini V3 and u-he Diva needs licensed
# plugins installed on a workstation. GitHub-hosted runners do not have them.
# That half is produced on a provisioned host and committed as snapshots under
# docs/reference-freshness/ (see its README); the `reference-freshness` job
# below fails if they are absent or stale, so the gap is visible, not assumed.
name: nightly

on:
  schedule:
    - cron: '0 7 * * *'        # 07:00 UTC daily
  workflow_dispatch:

# Without this the nightly cannot push its own records commit back
# (dag.yml carries the same permission for the same reason).
permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------- the slow
  # bit-exactness runs. These are the ones a push cannot afford.
  full-rtl:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          # The committed-roadmap check below renders the DAG from the
          # committed records, which needs the history and tags the [dag] bot
          # rendered them with. A shallow clone cannot answer "did a covered
          # file change since this was recorded" and renders REFUSED; without
          # tags the STAMPED nodes render differently from the committed
          # README. Both measured to fail --check on a tree whose committed
          # README is consistent (#906) -- an unsatisfiable gate, not a check.
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install --upgrade pip numpy scipy pytest
      - run: python3 tools/ci_apt_install.py iverilog

      # The committed roadmap is judged BEFORE anything rewrites it (#906).
      # `--run --slow` below regenerates README.md, and the strict check after
      # it would then be reading the file this job just wrote -- the same
      # defeat rungs.yml carried (#906). This step is the nightly's net on the
      # tree as committed: if main's README disagrees with its committed
      # evidence -- a [dag] push that failed to regenerate, a hand-edited
      # table -- the nightly fails here rather than laundering the divergence
      # through the regen below.
      - name: the committed roadmap matches the committed evidence
        run: python tools/compile_dag.py --check

      # The slow nodes the per-push job cannot run: compile_dag executes each
      # one's verifier and records (passed, detail, sha) into
      # docs/dag-results.json. A node FAILING is a recorded result, not an
      # aborted run -- an earlier shape of this job ran these same verifiers
      # as bare steps first, without that tolerance, so one failing verifier
      # left nothing recorded at all: exactly the loss this job exists to
      # prevent.
      - name: record the slow evidence for the roadmap
        # The `|| true` is broader than "a RED node is a result": without
        # --check --strict the tool already exits 0 on a RED node, so what the
        # tolerance actually buys is surviving a hard failure (a crashed
        # verifier, a missing README marker) so one broken node cannot lose
        # the other nodes' records. The hard failure is still caught one step
        # later: the commit step re-runs the tool with no tolerance, and the
        # strict check after that gates the job.
        run: python tools/compile_dag.py --run --slow || true

      # Carry the records to main. Until this step existed they lived only in
      # this job's artifact, and the README's F1/M1/D1/I1/I2 rows read STALE
      # or "never run" against evidence that had actually passed (#787). The
      # README is regenerated from the same records in the same step, so the
      # committed table and the committed records cannot disagree.
      #
      # The commit-and-push is tools/push_dag_records.py, not a bare `git
      # push`: over the 14 days measured in the #818 review, commits landed on
      # main inside this ~2h job's window about one night in three, and a bare
      # push is rejected non-fast-forward on exactly those nights -- records
      # written, job red, nothing persisted but the artifact. The tool
      # rebase-retries onto the moved main (bounded), union-merging the
      # records: slow nodes keep tonight's evidence, fast nodes take
      # origin/main's fresher dag.yml records, and the README block is
      # re-rendered from the merge. The `[dag]` subject it commits with is
      # load-bearing -- dag.yml's job-level `if:` skips any push whose head
      # commit message contains it, so this push cannot re-trigger the
      # per-push job into a loop -- and is pinned against that guard by
      # test_check_workflows.py.
      - name: commit the records if they moved (retries onto a moved main)
        run: python tools/push_dag_records.py

      # The nightly CAN refresh the slow evidence, so it is the job entitled to
      # demand that nothing is RED or STALE. The per-push job only asserts the
      # README is accurate. This deliberately runs AFTER the commit step: a
      # RED node here (D3 today) is a finding, and a commit gated on this
      # check would never fire -- records written, job red, nothing
      # persisted, which is precisely the bug this job's history records.
      - name: nothing is red or stale
        run: python tools/compile_dag.py --check --strict
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: dag-results, path: docs/dag-results.json, if-no-files-found: ignore }

  # --------------------------------------------------------------- controls
  # A nightly run whose injected defects do not fire is a BROKEN nightly run,
  # not a quiet one. Every control here has been seen failing locally; if one
  # stops failing, either the defect stopped being injected or the check
  # stopped checking, and both are worse than a red build.
  controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install --upgrade pip numpy scipy pytest
      - run: python3 tools/ci_apt_install.py iverilog

      - name: the control link -- the exact defect that shipped
        run: |
          python rtl-sketch/verify_ctl.py
          python rtl-sketch/verify_ctl.py --inject SPI_ADDR7  --expect-fail
          python rtl-sketch/verify_ctl.py --inject SPI_DATA24 --expect-fail
      - name: the chip at its pins
        run: |
          python rtl-sketch/verify_synth_top.py
          python rtl-sketch/verify_synth_top.py --inject VOICE_MASTER_PRESHIFT --expect-fail
          python rtl-sketch/verify_synth_top.py --inject VOICE_DRUM_CLAMP16    --expect-fail
          python rtl-sketch/verify_synth_top.py --inject I2S_SHIFT             --expect-fail
          python rtl-sketch/verify_synth_top.py --inject I2S_DELAY             --expect-fail
          python rtl-sketch/verify_synth_top.py --inject MODAL_NUM_HOLD        --expect-fail
          python rtl-sketch/verify_synth_top.py --inject DRUM_ENV_FLOOR        --expect-fail
      # I2S_SWAP is BLIND at the whole chip (the core strobes past cycle 127, so a
      # swapped right channel is bit-identical -- see the Makefile's controls
      # target, #619). It is not listed above as a control that fires. The right
      # channel is covered by i2s_tx's own bench, which strobes early enough.
      - name: the right channel -- i2s_tx on its own bench (#619)
        run: |
          python rtl-sketch/verify_i2s_tx.py
          python rtl-sketch/verify_i2s_tx.py --inject I2S_SWAP --expect-fail
      # The build/report-tool half of docs/verification-rules.md rule 5 (#245).
      # Pure Python: it stages a copy of an archived ORFS run and drives the
      # shipped summarize.py, so no EDA tool is needed. Its X-propagation
      # sibling (pnr/report_synth_area.py) is NOT here because it needs yosys,
      # which this job does not install -- it lives in `make controls`, and it
      # REFUSES rather than skipping when the tool is absent.
      - name: the report tools -- a die area that is its own input must refuse
        run: |
          python pnr/orfs/area_provenance.py --expect ok
          python pnr/orfs/area_provenance.py --inject UTILIZATION_TARGET   --expect refused-circular
          python pnr/orfs/area_provenance.py --inject CORE_UTILIZATION_SET --expect refused-circular

      - name: the acceptance suites, against a do-nothing stub
        run: |
          TR808_STUB=silent python -m pytest model/test_808_acceptance.py -q && \
            { echo "the silent stub PASSED the 808 suite -- the suite tests nothing"; exit 1; } || \
            echo "silent stub correctly red"

  # ------------------------------------------------------------ measurement
  # Per voice and per property, never aggregated: an overall improvement must
  # not be able to hide a worse snare. This is the job that should hand the
  # next agent "CP decay tau 34.5 ms against a 47 ms target" rather than a
  # pass/fail it has to go looking behind.
  sound-report:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install --upgrade pip numpy scipy pytest
      - name: per-voice measurements against declared targets
        id: report
        run: |
          if [ ! -f model/sound_report.py ]; then
            echo "model/sound_report.py not present yet -- see issue #44"
            echo "rc=absent" >> "$GITHUB_OUTPUT"; exit 0
          fi
          mkdir -p nightly-report
          # NOT `python ... | tee`: `$?` after a pipe is TEE's status, so the
          # report's own exit code -- the thing the next step gates on -- would
          # be thrown away before anything could read it. CLAUDE.md records
          # three separate incidents of exactly that in this repository, each
          # one reporting success for a command that had failed.
          set +e
          python model/sound_report.py > nightly-report/sound-report.txt 2>&1
          rc=$?
          set -e
          cat nightly-report/sound-report.txt
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      # The report distinguishes [target] -- a document says so -- from [lock]
      # -- this model at a named commit. A lock that moves is a regression; a
      # target that misses is a defect. They are never mixed in a verdict, and
      # this step exists so a lock moving cannot pass quietly.
      #
      # Gated on `sound_report.py`'s OWN EXIT STATUS, not on the report text.
      # Until #242 this grepped for "MOVED"/"REGRESS", words the plain
      # (non-`--inject`) report never prints -- it prints "OUT " -- so the step
      # was an unconditional pass whatever the report said, and it stayed green
      # for nights on end while the report immediately above it already showed
      # two out-of-tolerance properties. A gate that cannot go red is
      # decoration; a gate keyed to a string the tool does not emit is worse,
      # because it looks like one that works.
      #
      # Three outcomes, kept distinct: 0 pass, 1 a property is outside its
      # tolerance (red), anything else the tool did not run at all -- NO
      # VERDICT, which is also red but is not the same finding.
      - name: no locked property may have moved (nor any target be missed)
        run: |
          rc='${{ steps.report.outputs.rc }}'
          case "$rc" in
            absent)
              echo "model/sound_report.py not present -- nothing to gate" ;;
            0)
              echo "every declared property is inside its tolerance" ;;
            1)
              echo "::error::a declared property is outside its tolerance:"
              grep -E "^ +OUT " nightly-report/sound-report.txt || true
              echo "A [lock] outside tolerance means the model CHANGED -- fix it,"
              echo "or re-lock it in model/sound_report.py's LOCKS and RELOCKS and"
              echo "say in the commit message which commit changed the sound."
              exit 1 ;;
            *)
              echo "::error::sound_report exited '$rc'; it did not run, so this gate"
              echo "::error::has NO VERDICT -- that is not a pass."
              tail -20 nightly-report/sound-report.txt || true
              exit 1 ;;
          esac

      # Spot-check that the report can still go red. The full eleven-injection
      # sweep is roughly half an hour; four here, rotated, keeps the nightly
      # honest without doubling its runtime. The full sweep belongs in the
      # weekly tier. bd-ma-envelope and sd-centroid-amp-weighted (issue #52)
      # are permanent injections of bugs that actually shipped, not invented
      # defects -- see their descriptions in model/sound_report.py's
      # INJECTIONS dict.
      - name: the report can still go red
        run: |
          # An injection that CRASHES is not a caught defect. This previously
          # swallowed the status with `|| true` and grepped for MISS/FAIL/MOVED,
          # so a traceback mentioning any of those words counted as success --
          # a tool that could not run looked exactly like a control that worked.
          set -u
          for inj in sd-noise-6db ladder-2pole bd-ma-envelope sd-centroid-amp-weighted; do
            out="/tmp/inj-$inj.txt"
            set +e
            python model/sound_report.py --inject "$inj" > "$out" 2>&1
            rc=$?
            set -e
            # cmd_inject returns 1 when NOTHING moved (the control did not
            # fire -- a coverage hole) and 0 when at least one property moved
            # by more than its tolerance (the control fired; this is the
            # expected outcome here). Anything else means the tool did not
            # run at all: no verdict, not a pass.
            if [ "$rc" -gt 1 ]; then
              echo "::error::$inj -- sound_report exited $rc; the control did not run"
              tail -20 "$out"; exit 1
            fi
            if ! grep -qE "^ *MOVED" "$out"; then
              echo "::error::$inj ran but moved no property -- the control does not fire"
              tail -20 "$out"; exit 1
            fi
            echo "$inj moved the report"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: sound-report, path: nightly-report/, if-no-files-found: ignore }

  # ------------------------------------------------ the half that needs a Mac
  # Surge XT, Arturia Mini V3 and u-he Diva are licensed and installed on a
  # workstation, not on a hosted runner. This job does not pretend to run them;
  # it fails if the locally-produced result has gone stale, so "we have not
  # compared against the references lately" is a red build rather than silence.
  reference-freshness:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # commit age needs full history; shallow is REFUSED
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # Exit 0 FRESH, 1 STALE, 2 REFUSED (absent/unusable/no history). The check
      # prints the supported producer command and the publication instructions.
      # It measures COMMIT age only; see tools/reference_freshness.py.
      - name: the reference response snapshot must not be absent or stale
        run: python tools/reference_freshness.py
