# The capability DAG's permanent regression gate -- docs/capability-dag.md.
#
# Every stamped node's test set runs here on every push that could affect it.
# The `moog-acceptance` workflow is path-filtered to model/, audition/ and
# spec/, so an RTL or flow change cannot turn it red. A promise conditioned on
# which directory you edited is not a promise -- so the condition here is the
# other way round (issue #457): tools/ci_changes.py skips the suite ONLY when
# every changed path is positively recognised as agent tooling or as prose no
# suite names, and anything it does not recognise, including a path that did
# not exist when it was written, runs everything. A push to main always runs
# everything. No workflow-level `paths:` either: a path-skipped workflow never
# reports, which would leave a required check waiting forever (#287).
name: nodes

# Triggers (#540, #463; operator ruling 2026-10-15): `push` is limited to main
# plus measure/** and release/** -- branches that land work with no PR, so no
# pull_request copy verifies them. A branch with an open PR runs once, as the
# PR, instead of twice (a bare push + pull_request ran every PR commit twice).
# moog-acceptance.yml keeps its own triggers (#264 header). Measured 7 days to
# 2026-10-06: ~74 main job-min/day (5%) saved by this and the cancel rule.
on:
  push:
    branches: [main, 'measure/**', 'release/**']
  pull_request:
  workflow_dispatch:

jobs:
  # Which suites this change can affect: tools/ci_changes.py. Every job below
  # needs it and skips only on an explicit `none` or `docs`, so a failure here
  # (no output) runs everything. A job skipped by its `if:` reports success,
  # so a required check is never left waiting.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.classify.outputs.scope }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: classify
        run: python3 tools/ci_changes.py

  pulse2x-rtl:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.scope != 'none' && needs.changes.outputs.scope != 'docs' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    concurrency:
      # push and pull_request events of the same branch share github.head_ref;
      # one group for both meant the PR run CANCELLED the push run's job
      # (35715612528: 'Canceling since a higher priority waiting request
      # exists'), which read as a red pulse2x-rtl with no defect behind it.
      # Key by PR number / full ref so the two event kinds queue separately.
      group: pulse2x-short-${{ github.event.pull_request.number || github.ref }}
      # Only a PR run is superseded; a started main run is never cancelled.
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install numpy scipy pytest
      - run: sudo apt-get update && sudo apt-get install -y iverilog autoconf flex libfl-dev bison help2man
      - uses: actions/cache@v4
        with:
          path: .tools/verilator-5.052
          key: ubuntu24-verilator-ea338be98e1e838d3518809ce8899f85a009963c
      - run: python tools/setup_ci_verilator.py
      - name: simulator identity and independent converter diagnostic
        run: |
          python tools/setup_ci_verilator.py --assert-path
          python tools/verify_rate_conv_2x.py --simulator verilator
      - name: pulse candidate, transport, deadlines and disabling control
        run: >-
          python tools/run_controls.py --jobs 2 --timeout 900 --json build/pulse2x-ci.json
          "python rtl-sketch/verify_voice.py --set quick --only waves3 --filter2x --pulse2x --outdir build/pulse-voice"
          "python rtl-sketch/verify_voice.py --set quick --only waves3 --filter2x --pulse2x --simulator verilator --outdir build/pulse-voice-verilator"
          "@baseline=pulse-smoke python rtl-sketch/verify_synth_top.py --m5a-smoke --filter2x --pulse2x --simulator verilator --outdir build/pulse-smoke"
          "@after=pulse-smoke python rtl-sketch/verify_synth_top.py --m5a-smoke --filter2x --pulse2x --simulator verilator --inject VOICE_PULSE2X_OFF --expect-fail --outdir build/pulse-off"
          "python rtl-sketch/verify_synth_top.py --filter2x --pulse2x --simulator verilator --outdir build/pulse-drums"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pulse2x-ci
          path: |
            build/pulse2x-ci.json

  reference-controls:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.scope != 'none' && needs.changes.outputs.scope != 'docs' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install numpy scipy pytest
      - name: restore and verify the frozen Surge audio
        run: |
          python -m pytest tools/test_refprofile_restore.py -q
          python tools/refprofile_restore.py
          python tools/refprofile.py
      - name: missing and tampered clips must change valid clean comparisons
        run: >-
          python tools/run_all.py --timeout 600 --json build/reference-controls.json
          "python tools/run_case.py --inject REF_PROFILE_MISSING F1A F1B F1C --results build/ref-missing --expect 'no verdict'"
          "python tools/run_case.py --inject REF_PROFILE_TAMPERED F1A F1B F1C --results build/ref-tampered --expect 'no verdict'"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reference-controls
          path: build/reference-controls.json

  m5a-fast:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.scope != 'none' && needs.changes.outputs.scope != 'docs' }}
    # The explicitly scoped sound-development gate stays independent of the
    # broad model suite below, so a long repository run cannot hide its result.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # tools/test_run_case.py asserts batch provenance against origin/main.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install --upgrade pip numpy scipy pytest pyyaml
      - run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: focused sound and selected-path gate
        run: make verify-fast

  python:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.scope != 'none' && needs.changes.outputs.scope != 'docs' }}
    # GitHub-hosted (free on a public repo) since the 2026-09-30 Blacksmith
    # outage and the operator's move of every public repo off Blacksmith
    # (2am `docs/ci.md` §"Blacksmith: decided 2026-09-28, retire").
    runs-on: ubuntu-24.04
    # 30 was already marginal before the claim-checker steps below: the two
    # runs on this PR took 14m39s and 27m20s, so the job's own variance nearly
    # spends the cap on its own. The claim checker and its controls measured
    # 22s + 45s locally; adding them under a 30-minute cap would buy a gate at
    # the price of an intermittent red, which is the trade
    # docs/failure-modes.md says not to make.
    #
    # 70, not 40, since the move to GitHub-hosted (2026-09-30). On Blacksmith
    # this job measured 17-23 min over 34 runs; the first two hosted runs
    # (PR #489, push + pull_request) took 36.4 and 40.3 min -- the second
    # would already have been cancelled at 40. 70 is ~1.75x the hosted max,
    # the same headroom 40 gave over Blacksmith's 23. Re-measure once more
    # hosted runs accumulate.
    timeout-minutes: 70

    # Issue #422. On 2026-09-28 the `everything else` step below exited 139 --
    # SIGSEGV, core dumped -- 12m40s in, at 30 % collected, with the innermost
    # Python frame at model/drums_fx.py's `Env.out`:
    #
    #     return self.level >> (ENV_BITS - 15)
    #
    # A shift of two ints cannot fault, and the traceback's ~30 Python frames run
    # unbroken into pytest's runner, so it is neither our arithmetic nor runaway
    # recursion: the interpreter or a native extension died and surfaced at
    # whatever frame happened to be innermost. The SAME COMMIT passed this job on
    # its other trigger -- push 36377452558 crashed, pull_request 36377455006
    # passed -- so it is non-deterministic, established rather than assumed.
    #
    # The full measurement is docs/ci-segfault-2026-09-28.md. What is pinned here
    # does NOT claim to fix it -- nothing reproduced it in 120 runs -- and is
    # justified by two numbers rather than by plausibility:
    #
    #   - `tools/crash_rate.py --runs 60`, twice, on the exact failing nodeid and
    #     the exact stack that crashed (Python 3.12, numpy 2.5.3, scipy 1.18.1):
    #     0 crashes in 120 runs that reached the code. So the honest status is
    #     "bounded and instrumented", not "repaired", and the reason for pinning
    #     is the second number, not the first.
    #   - that same path takes the process from 1 OS thread to 15 under those pip
    #     wheels, and to 1 under Ubuntu's apt numpy. The thread count of a job
    #     that died in its main interpreter thread is therefore a function of the
    #     runner tier and of whatever pip resolved that morning, neither of which
    #     is in the commit. Pinning makes the numeric environment a property of
    #     the commit, which is what makes a future crash rate comparable at all.
    #     Cost, from the 60+60 paired runs under one load: median 12.86 s pinned
    #     against 13.26 s unpinned -- 3 % FASTER, because these are least-squares
    #     fits over a few hundred samples, where starting a thread pool costs
    #     more than it returns.
    #
    # Deliberately NOT applied to the other jobs in this file, which run the same
    # wheels unpinned. That leaves a control: a recurrence in `m5a-fast` or `rtl`
    # but never here is evidence about threading, and a recurrence in both is
    # evidence against it. Pinning everything would have destroyed the only
    # comparison this repository can run without reproducing the crash.
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          # check_stale_base compares against origin/main, and a merge-base
          # cannot be computed from a shallow single-branch clone. Without this
          # the step fails on every run -- which tools/check_workflows.py caught
          # in this very file, on its first outing.
          fetch-depth: 0
          # The roadmap step below renders the DAG from annotated tags: the
          # committed README carries STAMPED rows, and without tags those
          # nodes render a different status, so --check fails on a README
          # that is consistent (#906 measured this; #940 filed it). Stated
          # here where the precondition is used, not inherited from
          # fetch-depth's undocumented tag side effect -- nightly.yml's
          # full-rtl checkout states the same precondition the same way.
          fetch-tags: true
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install --upgrade pip numpy scipy pytest pyyaml

      # The checking machinery is the one artefact nothing checked, and four CI
      # defects landed in one session because of it. An unparseable workflow is
      # not a failed build -- GitHub silently does not register it, so it looks
      # exactly like one that passed.
      - name: the workflows themselves parse and can run
        run: python tools/check_workflows.py

      # The roadmap is compiled from evidence, not maintained by hand. This
      # document twice carried findings that had already been fixed -- the
      # modal_dp exc hazard, and red on four repaired drum circuits. Non-strict
      # --check fails when the README disagrees with the recorded evidence. It
      # does not fail merely because a node is RED or STALE; that
      # project-health gate is nightly's `--check --strict` (nightly.yml).
      # The evidence is ACTUALLY EXECUTED here, not merely present: an earlier
      # version of this script called a node green when its test file existed
      # -- so a suite with every assertion deleted would have rendered green,
      # which is the exact failure the tool exists to prevent.
      #
      # The check runs FIRST, against the README AS COMMITTED on this branch.
      # #906 had the order inverted: --run regenerates README.md, so a --check
      # placed after it verified the file the line above had just written and
      # could not fail for the only thing non-strict --check asserts -- README
      # staleness. Measured: PR #818's head (30f1b41e) fails `--check` outright
      # on its committed tree while the old step passed. On a red gate the
      # regen does not run (the step stops at the check); the author
      # regenerates locally (`python tools/compile_dag.py`) and commits the
      # result, which is exactly the honesty this step exists to demand of a
      # pull request. On main the bot regenerates and commits instead -- see
      # .github/workflows/dag.yml.
      #
      # Why not regen-then-`git diff --exit-code -- README.md`: suite details
      # render VERBATIM into the table and carry wall-clock timings ("105
      # passed in 472.54s"), so every fresh --run rewrites the README and the
      # diff churns red on every run. tools/test_rungs_gate.py pins the step's
      # shape: RED on a stale committed README, GREEN on a regenerated one --
      # where the pre-fix ordering was green on both.
      #
      # --run still executes each fast node's suite and records pass/fail with
      # this commit, after the check. The `|| true` is deliberate: a RED node
      # is a result to record, not a reason to stop. RED and STALE nodes are
      # reported in the job log, not failed here.
      - name: the roadmap matches the evidence
        run: |
          python tools/compile_dag.py --check        # the committed README vs the committed evidence
          python tools/compile_dag.py --run || true  # a RED node is a result

      # First on purpose: every node above F1 measures with these estimators,
      # so a suite built on untested analysers measures the analysers.
      # Would merging this branch lose anything? Answered by MERGING it, not by
      # diffing -- inferring from `git diff main branch` (two-dot) produced
      # three false alarms, because everything main gained since the branch
      # point shows up there as a deletion.
      - name: the merge would not lose a file
        run: python tools/check_stale_base.py --base origin/main --head HEAD

      # Every registered tunable parameter ships a value its own committed
      # sweep covers, and every verdict is recomputed from the measurements
      # rather than read out of the record. --changed-since additionally
      # prices any registered parameter this branch moves: on main it finds
      # nothing to price, which is why the step is satisfiable on every push
      # as well as on every PR. docs/sensitivity-sweeps.md.
      - name: a tunable parameter was swept before it was argued about
        run: python tools/sensitivity.py check --changed-since origin/main

      # ... and the gate can fail. Each injection corrupts the records in
      # memory in one specific way the gate exists to catch; a run where none
      # of these fires is a broken run, not a quiet one.
      - name: the sensitivity gate can still fail
        run: |
          python tools/sensitivity.py check --inject VERDICT_ASSERTED --expect fail
          python tools/sensitivity.py check --inject POINT_TRANSCRIBED --expect fail
          python tools/sensitivity.py check --inject GRID_CHERRY_PICKED --expect fail
          python tools/sensitivity.py check --inject SHIPPED_OFF_GRID --expect fail
          python tools/sensitivity.py check --inject PREDICTION_WRONG --expect fail
          python tools/sensitivity.py check --inject RULE_UNSTATED --expect refused

      - name: F3 -- measurement ground truth
        run: python -m pytest model/test_audio_measure.py -q
      - name: M2 -- the voice is musically a Minimoog
        run: python -m pytest model/test_moog_acceptance.py -q
      # The two instruments issue #422 added live under tools/, which
      # `pytest model/ spec/` does not collect and which no job runs in full --
      # exactly the gap #390 found, where the SN tone-stage derivation was
      # carried by a file no workflow collected. Named here, and named BEFORE the
      # step it guards: tools/run_with_rss.py stands in front of the one step
      # that has already died of SIGSEGV, so an unexercised copy of it is a false
      # green waiting to happen. Its load-bearing control is a child that really
      # does segfault and must still exit 139 through the wrapper.
      # Measured 7.7 s + 8.3 s on the 8-vCPU worker, so the 40-minute cap above
      # is untouched.
      - name: the crash instruments' controls
        run: |
          python -m pytest tools/test_run_with_rss.py -q
          python -m pytest tools/test_crash_rate.py -q

      # Wrapped for issue #422. The crash could not be classified after the fact
      # because this job recorded neither peak RSS nor `ulimit -s`, and an OOM
      # kill (137) and a native fault (139) are different problems with different
      # fixes. The wrapper prints both, plus MemTotal/MemAvailable and which
      # thread limits are in force, BEFORE the command runs -- so the envelope
      # survives a child that takes the runner down with it -- and passes the
      # child's status through unchanged: a SIGSEGV still exits 139 here.
      # Measured on the 8-vCPU worker: 98 MB peak for the failing test alone and
      # 245 MB for this whole step, so on a runner with GB of headroom memory was
      # never near the edge, which is what makes 139 rather than 137 coherent.
      # The runner's OWN ulimit and MemTotal have never been recorded; the next
      # run of this job is the first that will print them.
      #
      # `--require-thread-pins` asserts the job-level env: block above is
      # actually in force, at the one step whose numeric environment it changes.
      # Measured (docs/ci-segfault-2026-09-28.md §2, replicated on a second
      # host): this path runs 15 OS threads unpinned and 1 pinned, and the two
      # logs are otherwise identical -- so a mitigation that silently stopped
      # applying (a renamed key, a step-level env: shadowing it, the job split in
      # two) would leave every future crash rate incomparable with no signal at
      # all. It refuses with 126 WITHOUT running the suite rather than measuring
      # an environment nobody checked; 126 and 127 are used because no pytest run
      # produces either. Both directions are controlled in
      # tools/test_run_with_rss.py, including that the refusal cannot launder a
      # SIGSEGV -- with the pin in force a segfaulting child still exits 139.
      - name: everything else
        run: >-
          python tools/run_with_rss.py --require-thread-pins --
          python -m pytest model/ spec/ -q

      # ---------------------------------------------------------------------
      # THE GATES THEMSELVES. Every step from here to the end of this job is a
      # TOOL issuing a verdict about this tree, and each one used to be preceded
      # here by a named `pytest tools/test_<that checker>.py` step carrying its
      # controls. Those per-file steps are gone, and the reason is #404: naming
      # files here made the set of tool tests CI runs and the set that exists
      # two lists that could drift, and they had -- to 7 files named against 90
      # that exist. The `tools` job below now collects the WHOLE directory, so
      # every one of these checkers' controls still runs on every push, along
      # with the 83 files that were in no list at all.
      #
      # "Controls first" survives as a property of the RUN rather than of the
      # step order: a broken checker turns the `tools` job red beside whichever
      # gate below it invalidates, in the same checks list, on the same commit.
      # What these steps keep is the thing a directory run cannot give -- a GATE
      # failure and a TEST failure are different facts, and the checks list
      # should say which one happened without anyone opening a log.
      # ---------------------------------------------------------------------

      # The claim checker gates prose against the tree, so it has to RUN on a
      # pull request or it gates nothing -- the list it was commissioned to fix
      # stayed wrong for a week because nothing was re-deriving it, and a gate
      # nothing invokes fails exactly the same way.
      - name: documented claims match the evidence
        run: python tools/check_doc_claims.py

      # The classifier that decides whether this job runs at all. It can only
      # change through tools/, which is always `full`, so this job is where
      # its controls are guaranteed to run.
      - name: the CI change classifier and its wiring
        run: python -m pytest tools/test_ci_changes.py -q

      # The FPGA fit reporter (#565). report.sh used to print "RESULT: routed."
      # from the absence of an ERROR line, so an empty or killed nextpnr log
      # read as a fit. Its injected-bug controls and the fake-executable
      # `make -C fpga` tests need no EDA tools. Named explicitly: this does not
      # depend on how #482 ends up collecting the other fpga/test_*.py files.
      - name: the FPGA fit reporter refuses incomplete place-and-route logs
        run: python -m pytest fpga/test_pnr_report.py -q

      # Same argument, one file over: the oscillator-1 Shape/Width table in
      # model/reference_rigs.py is a hand transcription of
      # docs/surge-waveform-mapping.txt, and that comment now says outright that
      # the two "cannot drift silently again". It could not say that while the
      # checker ran only under `make verify` (build box) and `make controls`
      # (not what nightly.yml's controls job invokes) -- a comment asserting an
      # enforcement no CI job performs is issue #271's own defect, one level up.
      # Measured <0.1s, so the 40-minute cap and the variance note at the top of
      # this job are untouched.
      - name: the oscillator-1 comment still transcribes the sweep
        run: python tools/check_surge_waveform_comment.py

      # Decision-record numbering, and this one has to run ON THE PULL REQUEST
      # or it gates nothing: the next free DR number cannot be read off your own
      # branch, so two PRs each took 0017 within two minutes and both merges
      # were clean because the filenames differ (issue #250). The pull request is
      # the only place the collision is visible before it is on main. `make
      # verify` is invoked by no workflow, so the Makefile job alone would not
      # have caught either of the two collisions that shipped. Measured 0.05s.
      - name: every decision record owns its number
        run: python tools/check_decision_record_numbers.py

      # The three cymbal-369 / W14b gates. Each is a tool issuing a verdict off
      # COMMITTED evidence -- docs/scorecard/cymbal-369/fischer.json for the
      # TONE knob law, werner-fig9.json and werner-fig4.json for the other two
      # -- so all three answer here without the ~30 MB Fischer corpus and
      # without the ~6 MB SN scan. Measured on this worker: 31 s, 6.6 s, 2.5 s.
      #
      # Be exact about what this job does NOT decide. The TONE knob gate's two
      # corpus-gated controls report NO VERDICT without the WAVs, and this step
      # still exits 0 with them undecided. NO VERDICT is not a pass; those two
      # are enforced by `make reference-integration`, which runs the same tool
      # with --require-corpus on the box that has the corpus. This job is the
      # part of the argument that can be made without the corpus -- all 25
      # settings in the 1 s window, and 5 of the 7 injected defects -- and not
      # all of it.
      #
      # #390 found the shape of this the hard way one level down: the SN p.13
      # tone stage's most structural claim was carried by a test file NO
      # workflow collected -- not skipped, absent -- and the fix at the time was
      # to name two more files in this job. #404 is that fix generalised: the
      # `tools` job below collects the directory, so the answer to "does this
      # check run in CI, or only on a build box?" is YES by construction rather
      # than by whoever remembered to edit this list.
      - name: the TONE knob gate itself, as the tool issues it
        run: python tools/cymbal_tone_knob.py --check
      - name: the tone-stage realisation gate, as the tool issues it
        run: python tools/cymbal_tone_realisation.py --check
      - name: the Figure 9 digitiser gate, as the tool issues it
        run: python tools/werner_fig9.py --check

      # The #369 step 11 read (Q16/Q17/Q18). Every number comes from component
      # values already committed in the module plus the committed
      # docs/scorecard/cymbal-369/balance/balance.json, so the gate runs with NO
      # network and NO scan. Its 46 controls (tools/test_cymbal_vca_drive.py,
      # which exercise the REFUSAL paths for the ~6 MB SN p.13 scan rather than
      # skipping) run in the `tools` job's directory collection (#404), not as
      # a named step here. Measured on the 8-vCPU worker: 2.4 s.
      - name: the swing-VCA drive gate itself, as the tool issues it
        run: python tools/cymbal_vca_drive.py --check

      # A green run must be capable of being red -- and this control has to
      # test the SUITE, not the Python parser. An earlier version of this file
      # renamed a parameter into `def rms(_unused=None, x)`, which is a syntax
      # error: the module failed to import, pytest exited nonzero, and the
      # control "passed" having proved only that Python rejects bad syntax.
      # That is the same vacuous-control mistake PR #5 was opened to fix.
      #
      # So: each mutation must still COMPILE and still IMPORT, and only then is
      # a failure evidence that the suite detects wrong arithmetic.
      - name: the suite detects wrong arithmetic, not just bad syntax
        run: |
          python - <<'PY'
          import importlib, pathlib, subprocess, sys
          p = pathlib.Path("model/audio_measure.py")
          orig = p.read_text()
          # (label, exact source to replace, replacement) -- each is valid
          # Python that returns a numerically wrong answer.
          MUTANTS = [
              ("rms inflated 5 %",
               "return float(np.sqrt(np.mean(x * x))) if len(x) else 0.0",
               "return float(np.sqrt(np.mean(x * x)) * 1.05) if len(x) else 0.0"),
              ("T20 conversion off by 10 %",
               "return TAU_TO_T20 * tau_s",
               "return TAU_TO_T20 * tau_s * 1.10"),
          ]
          failures = []
          for label, old, new in MUTANTS:
              if old not in orig:
                  failures.append(f"{label}: anchor text not found -- control is stale")
                  continue
              p.write_text(orig.replace(old, new, 1))
              try:
                  # 1. it must still be valid Python ...
                  compile(p.read_text(), str(p), "exec")
                  # 2. ... and must still import, or we are testing the parser
                  r = subprocess.run([sys.executable, "-c",
                                      "import sys; sys.path.insert(0,'model'); import audio_measure"],
                                     capture_output=True)
                  if r.returncode != 0:
                      failures.append(f"{label}: mutant does not import -- tests the parser, not the suite")
                      continue
                  # 3. ... and NOW the suite must notice the wrong number.
                  r = subprocess.run([sys.executable, "-m", "pytest",
                                      "model/test_audio_measure.py", "-q"],
                                     capture_output=True)
                  if r.returncode == 0:
                      failures.append(f"{label}: suite passed with wrong arithmetic")
                  else:
                      print(f"  caught: {label}")
              finally:
                  p.write_text(orig)
          if failures:
              sys.exit("negative control failed:\n  " + "\n  ".join(failures))
          print("negative control OK -- wrong arithmetic turns the suite red")
          PY

  # The tooling suite, collected as a DIRECTORY and not as a hand-maintained
  # list of filenames (#404).
  #
  # Before this job, rungs.yml named 7 of the 90 tools/test_*.py files that
  # exist. The other 83 ran under `make verify` on a build box and under NO CI
  # job at all -- including every cymbal-369 gate's injected-bug controls, whose
  # whole purpose is to be the thing that turns red. A check that CANNOT RUN
  # must never look like one that passed, and a control nothing exercises is the
  # quietest version of that failure: it reads green because it never reads at
  # all. The gap was not noticed by anyone maintaining the list; it was noticed
  # by counting the list against the directory.
  #
  # So the point of the directory form is one mechanism instead of two lists
  # that can drift -- and had, by 83 files. A new tools/test_*.py is covered
  # here by EXISTING. That is also the acceptance test this job was written
  # against: a deliberately-failing file dropped under tools/ must turn this
  # job red with no edit to this file.
  #
  # Its own job rather than a step in `python`, and the reason is the cap, not
  # taste. The directory measured ~21 min alone (1346 passed, 1 skipped, #401's
  # recorded run at c20162c) against a `python` job whose own two runs on one PR
  # took 14m39s and 27m20s. Folding them together buys an intermittent red --
  # the exact trade the note at the top of `python` says not to make -- and the
  # split also keeps a TOOLING failure readable as a tooling failure in the
  # checks list rather than as a line in someone else's 40-minute log.
  #
  # Gated on `changes` like every other suite job (#457): tools/ is always
  # `full`, so an edit to a tool or its test always runs this. GitHub-hosted
  # since the operator's 2026-09-30 move of every public repo off Blacksmith
  # (2am `docs/ci.md` §"Blacksmith: decided 2026-09-28, retire").
  #
  # 105, not the 60 that survived the move (#1236): the ~21 min Blacksmith
  # measurement did not. Hosted, the directory grew to 56m49s-59m19s
  # whole-job across five green runs on main (Actions API, 2026-11-24),
  # ~95-96% of a 60-minute cap, and a PR run that crossed the cap was
  # cancelled at [96%] with NO pytest summary -- the failing tests' identity
  # had to be re-derived from dot-progress by index. A cap a growing suite
  # reaches nondeterministically is a red unrelated to the diff, and a
  # cancelled run reports nothing where a verdict belongs. 105 is ~1.75x the
  # 59m44s hosted maximum, the same headroom the `python` job's 70 gives
  # over its own 40.3 min hosted max. Re-measure once more hosted runs
  # accumulate.
  tools:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.scope != 'none' && needs.changes.outputs.scope != 'docs' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@v4
        with:
          # tools/test_run_case.py asserts batch provenance against origin/main
          # and tools/test_check_stale_base-style tests compute a merge-base;
          # neither can be answered from a shallow single-branch clone.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      # soundfile IS installed (unlike sympy below): the #1183 control
      # tools/test_measure_repeatability_refusal.py::
      # test_cut_into_strike_reference_exits_refused_2 reaches its subprocess
      # only via pytest.importorskip("soundfile"), so without it the control
      # silently skips and the refusal boundary it guards is never exercised.
      # Measured (#1262): with soundfile the 12 files that import the
      # soundfile-using modules give 376 passed / 0 skipped, vs 375 passed /
      # 1 skipped without; no corpus-gated test or probe misreports.
      - run: python -m pip install --upgrade pip numpy scipy pytest pyyaml soundfile
      # Five files under tools/ shell out to iverilog (test_check_f1_rtl_record,
      # test_check_iverilog_generate_case_string, test_run_controls,
      # test_score_f1_rtl, test_trial). sympy is deliberately NOT installed:
      # test_tone_stage_schematic's sympy witness is meant to be a VISIBLE skip
      # beside two numpy-only witnesses of the same fact that do run.
      - run: sudo apt-get update && sudo apt-get install -y iverilog
      # Not set here, on purpose: GF180_TR808_REFS. The corpus is ~30 MB and is
      # not in the repo, so the tests that need the WAVs skip visibly and the
      # corpus-gated controls report NO VERDICT. `make reference-integration`
      # runs the same files with GF180_REQUIRE_TR808_REFS=1 on the box that has
      # them, where a missing corpus REFUSES instead of skipping.
      #
      # No deselects. This job's first outing found two tests in
      # tools/test_verify_deadline.py red on main (the -l2 captures predated
      # the tree's saw-drive stimulus, #426); they were deselected by name
      # behind a step that REQUIRED them to stay red for that reason, so the
      # exclusion would retire itself. main's re-capture (a224050, #443) made
      # them pass -- the guard step's own "now PASS" branch, run on this merge --
      # so the deselects and the guard go with the merge that brought it in.
      - name: every tools/ test, by directory
        run: python -m pytest tools/ -q

  # The 16 fpga/ test files no other CI job runs (#853) -- the fpga half of the
  # #404 shape (tools/ above is the same repair; pnr/ is #851). Measured on a
  # hosted-runner equivalent, 2026-11-16: all 16 pass under
  # spec/trial-environment.json -- 320 tests in ~57 s; none needs Vivado, a
  # flashed Arty or the TR808 corpus at runtime (the "hardware" strings in
  # these files are paths and manifest keys -- measured, not device access).
  #
  # The pins are the point, not a nicety: three of the 16 (the release-bound
  # trials) preflight the spec and return NO VERDICT on drift, and the pty
  # harness refuses without pyserial -- so the unpinned
  # `pip install numpy scipy pytest pyyaml` the other jobs use reads here as
  # six red tests, not a pass. The spec, not hand-written versions, is the
  # single source of pins; --no-toolchain because no file in this set runs the
  # simulator (their trial manifests preflight no tools).
  #
  # No ignores and no deselects (the tools-job rule); there is nothing to
  # deselect: all 16 measured runnable, zero skips. The floor step is the
  # exclusion control: collection must stay at or above the FLOOR= below, so
  # an `--ignore`, a moved file or a deleted test cannot achieve an exclusion
  # silently -- and tools/test_fpga_uncovered_workflow.py (run by the tools
  # job, by directory) pins that floor to a live collection of the same
  # paths, so the number itself cannot drift.
  fpga-uncovered:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.scope != 'none' && needs.changes.outputs.scope != 'docs' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # ONE list, and both steps read it: the run executes it, the floor
      # counts it. fpga/release/ is collected by directory so the seven
      # release-evidence files cannot silently grow an eighth (#853).
      FPGA_UNCOVERED_PATHS: >-
        fpga/release/
        fpga/test_bringup_arty.py
        fpga/test_ext_io_extract.py
        fpga/test_ext_io_timing.py
        fpga/test_play_song.py
        fpga/test_record_compare.py
        fpga/test_uart_host_hold_refused.py
        fpga/test_uart_host_pty.py
        fpga/test_verify_flash.py
        fpga/test_verify_live_midi_unwrap.py
    steps:
      - uses: actions/checkout@v4
        with:
          # trial receipts record HEAD / origin/main / merge-base provenance
          # (tools/trial.py identities()); not answerable from a shallow clone.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      # Not set here, on purpose: GF180_TR808_REFS (the tools-job rule). No file
      # in this set reads the corpus -- measured -- so nothing would skip; the
      # rule costs nothing and keeps every suite job shaped the same.
      - name: install the spec, not guesses (idempotent; refuses on drift)
        run: python tools/trial_env.py bootstrap --no-toolchain
      - name: the 16 fpga/ files no other CI job runs
        run: python -m pytest $FPGA_UNCOVERED_PATHS -q
      - name: collection floor -- an exclusion cannot be silent
        run: |
          FLOOR=366
          st=0
          out=$(python -m pytest $FPGA_UNCOVERED_PATHS --collect-only -q 2>&1) || st=$?
          n=$(printf '%s\n' "$out" | sed -n 's/^\([0-9][0-9]*\) tests\? collected.*/\1/p' | tail -n 1)
          if [ -n "$n" ]; then
            echo "collected $n (floor $FLOOR)"
            [ "$n" -ge "$FLOOR" ] || {
              echo "REFUSED: collected $n < floor $FLOOR -- a test was silently lost or excluded"
              exit 1
            }
          else
            echo "REFUSED: collection itself failed (pytest exit $st, no '<n> tests collected' line) -- not a lost test; last lines:"
            printf '%s\n' "$out" | tail -n 5
            exit 1
          fi

  # The pnr suite, collected as a DIRECTORY (#404, one directory over from
  # tools/). Before this job, 5 of the 7 pnr/**/test_*.py files on main ran
  # under `make verify` on a build box and under NO CI job at all -- the same
  # gap #404 closed for tools/, found the same way: by counting the
  # hand-maintained list (Makefile:261 names two) against the directory.
  # A new pnr/**/test_*.py is covered here by EXISTING, with no edit to any
  # workflow or Makefile. (The Makefile list itself stays untouched: it is the
  # subject of open operator decision #812, which keeps those two files on
  # m5a-fast under every option.)
  #
  # Measured on the 8-vCPU worker (2026-11-15, origin/main @ 6be93eef):
  # 197 passed in 0.81 s -- three orders of magnitude under the tools job --
  # so the 10-minute cap is ~700x the measured runtime, the same headroom
  # logic the tools job's 105 gives over its ~59 min hosted maximum (#1236).
  #
  # Default checkout depth: no pnr/ test reads origin/main or computes a
  # merge-base, unlike tools/test_run_case.py (measured 2026-11-15). No
  # iverilog or other EDA tool: the suite parses synthetic logs and
  # monkeypatches its own precondition gates (pnr/klt/ladder_dp/test_run_klt.py
  # says so in its docstring).
  #
  # docker is deliberately NOT installed here. That is a precondition, not an
  # absence: the hosted ubuntu-24.04 image already provides it, and with
  # docker hidden from PATH one test errored FileNotFoundError -- it did not
  # skip -- until container_progress (pnr/shuttle/finish_halfslot.py) learned
  # to answer None for "docker cannot answer". The precondition is asserted in
  # the code, so a runner-image change degrades to a handled None, never to a
  # bare crash.
  pnr:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.scope != 'none' && needs.changes.outputs.scope != 'docs' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install --upgrade pip numpy pytest
      - name: every pnr/ test, by directory
        run: python -m pytest pnr/ -q
      # A green run must be capable of being red -- the same control the
      # `python` job carries for model/, and for the same reason: each mutation
      # must compile and import, so a failure left after those steps is
      # evidence the suite detects wrong arithmetic, not that Python rejects
      # bad syntax.
      - name: the suite detects wrong arithmetic, not just bad syntax
        run: |
          python - <<'PY'
          import pathlib, subprocess, sys
          p = pathlib.Path("pnr/shuttle/finish_halfslot.py")
          orig = p.read_text()
          # (label, exact source to replace, replacement) -- valid Python that
          # returns a numerically wrong iteration time.
          MUTANTS = [
              ("elapsed seconds off by one",
               "secs = int(m.group(4)) * 3600 + int(m.group(5)) * 60 + int(m.group(6))",
               "secs = int(m.group(4)) * 3600 + int(m.group(5)) * 60 + int(m.group(6)) + 1"),
          ]
          failures = []
          for label, old, new in MUTANTS:
              if old not in orig:
                  failures.append(f"{label}: anchor text not found -- control is stale")
                  continue
              p.write_text(orig.replace(old, new, 1))
              try:
                  # 1. it must still be valid Python ...
                  compile(p.read_text(), str(p), "exec")
                  # 2. ... and must still import, or we are testing the parser
                  r = subprocess.run([sys.executable, "-c",
                                      "import sys; sys.path.insert(0,'pnr/shuttle'); import finish_halfslot"],
                                     capture_output=True)
                  if r.returncode != 0:
                      failures.append(f"{label}: mutant does not import -- tests the parser, not the suite")
                      continue
                  # 3. ... and NOW the suite must notice the wrong number.
                  r = subprocess.run([sys.executable, "-m", "pytest", "pnr/", "-q"],
                                     capture_output=True)
                  if r.returncode == 0:
                      failures.append(f"{label}: suite passed with wrong arithmetic")
                  else:
                      print(f"  caught: {label}")
              finally:
                  p.write_text(orig)
          if failures:
              sys.exit("negative control failed:\n  " + "\n  ".join(failures))
          print("negative control OK -- wrong arithmetic turns the pnr suite red")
          PY

  # A prose-only change still carries claim markers backed by real tests
  # (docs/claim-markers.md), so it runs the claim checker -- the whole default
  # document set, not just the changed files, because the checker's own
  # include-list control only runs in default mode. Under `full` the python
  # job runs the same two steps.
  doc-claims:
    needs: changes
    if: ${{ needs.changes.outputs.scope == 'docs' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install --upgrade pip numpy scipy pytest pyyaml
      - name: the claim checker's controls
        run: python -m pytest tools/test_check_doc_claims.py -q
      - name: documented claims match the evidence
        run: python tools/check_doc_claims.py

  # RTL bit-exactness. Separate job because iverilog is slow: the ladder is
  # ~1 min, the full voice is ~20 and does not belong on every push.
  rtl:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.scope != 'none' && needs.changes.outputs.scope != 'docs' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install --upgrade pip numpy scipy pytest
      - run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: F1 -- ladder bit-exact
        run: python rtl-sketch/verify_ladder.py
      - name: M1 -- selected 2x Moog voice bit-exact (quick set)
        run: python rtl-sketch/verify_voice.py --set quick --osc2x --outdir build/voice-osc2x
      - name: M1b -- reconstructed 2x filter and measured pulse-duty challenger
        run: python rtl-sketch/verify_voice.py --set quick --only waves3 --filter2x --outdir build/voice-filter2x

      # The integration checks. These are the ones that matter most and were
      # the last to reach CI: every block in this design was bit-exact against
      # its model while the control link silently delivered 37 of 155 register
      # writes, because every bench drove the register write port rather than
      # the link. Block-level green is not integration green.
      - name: F2 -- modal bank bit-exact
        run: python rtl-sketch/verify_modal.py
      - name: I2 -- the control link carries every register write
        run: python rtl-sketch/verify_ctl.py
      - name: I4 -- selected 2x path at the pins, SPI in to I2S out
        run: python rtl-sketch/verify_synth_top.py --osc2x
      - name: I4b -- reconstructed filter candidate through SPI to I2S
        run: python rtl-sketch/verify_synth_top.py --m5a-smoke --filter2x --outdir build/top-m5a-filter2x

      # Each integration check carries a control that must turn it red. The
      # SPI_ADDR7 mutant reinstates the rev-1 seven-bit address field -- the
      # exact defect that shipped -- so it can never return silently.
      - name: the integration checks can still fail
        run: |
          python rtl-sketch/verify_ctl.py --inject SPI_ADDR7 --expect-fail
          python rtl-sketch/verify_ctl.py --inject SPI_DATA24 --expect-fail
          # Default-config clean twin: both synth mutants below run in default
          # config and no other clean step matches it (#1221); a red bench must
          # stop the step before a mutant is credited as caught.
          python rtl-sketch/verify_synth_top.py
          python rtl-sketch/verify_synth_top.py --inject VOICE_MASTER_PRESHIFT --expect-fail
          python rtl-sketch/verify_synth_top.py --inject I2S_SHIFT --expect-fail
      - name: the selected 2x path and integration reject disabling mutations
        run: |
          python rtl-sketch/verify_voice.py --set quick --only default --osc2x --inject OSC2X_OFF --expect-fail --outdir build/voice-osc2x-control
          python rtl-sketch/verify_synth_top.py --osc2x --inject VOICE_OSC2X_OFF --expect-fail --outdir build/top-osc2x-control
          python rtl-sketch/verify_synth_top.py --m5a-smoke --filter2x --inject VOICE_FILTER2X_OFF --expect-fail --outdir build/top-filter2x-control

  # The full 255,060-frame voice run and the drum runs, on demand and nightly
  # rather than per push.
  rtl-full:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install --upgrade pip numpy scipy pytest
      - run: sudo apt-get update && sudo apt-get install -y iverilog verilator
      - name: M1 -- one Moog voice bit-exact (full)
        run: python rtl-sketch/verify_voice.py --set full
      - name: D -- the eight-stop drum kit bit-exact
        run: python rtl-sketch/verify_drums.py
      - name: M5A -- complete reconstructed 2x filter phrase through SPI to I2S and score decoded audio
        run: python tools/verify_m5a_filter2x_i2s.py
      # A mutant is credited only against a clean run of its own config
      # (#1212): the step below is the exact clean twin (same script,
      # simulator and stimulus) of the disabling control after it, so a
      # Verilator build break can no longer register as "detected". The
      # full-phrase step above does not pair it -- different stimulus.
      - name: M5A -- clean Verilator smoke baseline for the disabling control
        run: python rtl-sketch/verify_synth_top.py --simulator verilator --m5a-smoke --filter2x --outdir build/top-clean-m5a-f2x-verilator
      - name: M5A -- Verilator integrated disabling control
        run: python rtl-sketch/verify_synth_top.py --simulator verilator --m5a-smoke --filter2x --inject VOICE_FILTER2X_OFF --expect-fail --outdir build/top-filter2x-verilator-control
      # The shipped R2 image sets PULSE2X; this is the only full-length
      # --pulse2x phrase run (moved here from a retired standalone workflow,
      # #760). It uses the pinned Verilator 5.052 that produced the September
      # result, not the apt build above. setup_ci_verilator.py prepends the
      # pinned build to PATH for the steps after it, so it sits last and the
      # earlier steps keep the apt verilator.
      #
      # These four steps carry `if: ${{ !cancelled() }}` so an earlier red step
      # (e.g. M5A above, #1148) does not skip the phrase run: with the default
      # success() every earlier failure silently removed it, and it never
      # executed in any dispatch (PR #1133 review, finding B).
      #
      # The phrase step itself additionally gates on the identity step's
      # outcome (#1154): a failed step does NOT set cancelled(), so a bare
      # !cancelled() phrase step would still run after a failed setup and
      # score the phrases under the apt verilator 5.020-1, emitting an
      # ungrounded M5A/M5B report. --assert-path refuses (rather than
      # reports) unless PATH resolves the pinned 5.052 build, and
      # steps.verilator_identity.outcome == 'success' turns that refusal
      # into a skipped phrase run. An earlier red step with identity green
      # still runs the phrases: !cancelled() keeps #1133's reachability.
      - if: ${{ !cancelled() }}
        run: sudo apt-get install -y autoconf flex libfl-dev bison help2man
      - if: ${{ !cancelled() }}
        uses: actions/cache@v4
        with:
          path: .tools/verilator-5.052
          key: ubuntu24-verilator-ea338be98e1e838d3518809ce8899f85a009963c
      - if: ${{ !cancelled() }}
        run: python tools/setup_ci_verilator.py
      - name: refuse the phrase run unless PATH resolves the pinned Verilator
        id: verilator_identity
        if: ${{ !cancelled() }}
        run: python tools/setup_ci_verilator.py --assert-path
      - name: pulse2x -- complete M5A and M5B phrases decoded from I2S and scored independently
        if: ${{ !cancelled() && steps.verilator_identity.outcome == 'success' }}
        run: >-
          python tools/run_all.py --jobs 2 --timeout 1800 --json build/pulse2x-phrases.json
          "python tools/verify_m5a_filter2x_i2s.py --case M5A --pulse2x --timeout 1700 --outdir build/full-M5A --verification build/pulse-evidence/M5A.txt --wav build/pulse-evidence/M5A-i2s.wav --record build/pulse-evidence/M5A.json --audio build/pulse-evidence/M5A-scored.wav"
          "python tools/verify_m5a_filter2x_i2s.py --case M5B --pulse2x --timeout 1700 --outdir build/full-M5B --verification build/pulse-evidence/M5B.txt --wav build/pulse-evidence/M5B-i2s.wav --record build/pulse-evidence/M5B.json --audio build/pulse-evidence/M5B-scored.wav"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pulse2x-phrases
          path: |
            build/pulse2x-phrases.json
            build/pulse-evidence/
