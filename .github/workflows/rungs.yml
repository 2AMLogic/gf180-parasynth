# The capability DAG's permanent regression gate -- docs/capability-dag.md.
#
# Every stamped node's test set runs here, on every push, with NO path filter.
# The `moog-acceptance` workflow is path-filtered to model/, audition/ and
# spec/, so an RTL or flow change cannot turn it red. A promise conditioned on
# which directory you edited is not a promise.
name: nodes

on: [push, pull_request, workflow_dispatch]

jobs:
  pulse2x-rtl:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    concurrency:
      # push and pull_request events of the same branch share github.head_ref;
      # one group for both meant the PR run CANCELLED the push run's job
      # (35715612528: 'Canceling since a higher priority waiting request
      # exists'), which read as a red pulse2x-rtl with no defect behind it.
      # Key by PR number / full ref so the two event kinds queue separately.
      group: pulse2x-short-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install numpy scipy pytest
      - run: sudo apt-get update && sudo apt-get install -y iverilog autoconf flex libfl-dev bison help2man
      - uses: actions/cache@v4
        with:
          path: .tools/verilator-5.052
          key: ubuntu24-verilator-ea338be98e1e838d3518809ce8899f85a009963c
      - run: python tools/setup_ci_verilator.py
      - name: simulator identity and independent converter diagnostic
        run: |
          verilator --version
          python tools/verify_rate_conv_2x.py --simulator verilator
      - name: pulse candidate, transport, deadlines and disabling control
        run: >-
          python tools/run_all.py --jobs 2 --timeout 900 --json build/pulse2x-ci.json
          "python rtl-sketch/verify_voice.py --set quick --only waves3 --filter2x --pulse2x --outdir build/pulse-voice"
          "python rtl-sketch/verify_voice.py --set quick --only waves3 --filter2x --pulse2x --simulator verilator --outdir build/pulse-voice-verilator"
          "python rtl-sketch/verify_synth_top.py --m5a-smoke --filter2x --pulse2x --simulator verilator --outdir build/pulse-smoke"
          "python rtl-sketch/verify_synth_top.py --m5a-smoke --filter2x --pulse2x --simulator verilator --inject VOICE_PULSE2X_OFF --expect-fail --outdir build/pulse-off"
          "python rtl-sketch/verify_synth_top.py --filter2x --pulse2x --simulator verilator --outdir build/pulse-drums"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pulse2x-ci
          path: |
            build/pulse2x-ci.json
            build/pulse2x-phrases.json
            build/pulse-evidence/

  reference-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install numpy scipy pytest
      - name: restore and verify the frozen Surge audio
        run: |
          python -m pytest tools/test_refprofile_restore.py -q
          python tools/refprofile_restore.py
          python tools/refprofile.py
      - name: missing and tampered clips must change valid clean comparisons
        run: >-
          python tools/run_all.py --timeout 600 --json build/reference-controls.json
          "python tools/run_case.py --inject REF_PROFILE_MISSING F1A F1B F1C --results build/ref-missing --expect 'no verdict'"
          "python tools/run_case.py --inject REF_PROFILE_TAMPERED F1A F1B F1C --results build/ref-tampered --expect 'no verdict'"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reference-controls
          path: build/reference-controls.json

  m5a-fast:
    # The explicitly scoped sound-development gate stays independent of the
    # broad model suite below, so a long repository run cannot hide its result.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # tools/test_run_case.py asserts batch provenance against origin/main.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install --upgrade pip numpy scipy pytest pyyaml
      - run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: focused sound and selected-path gate
        run: make verify-fast

  python:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # 30 was already marginal before the claim-checker steps below: the two
    # runs on this PR took 14m39s and 27m20s, so the job's own variance nearly
    # spends the cap on its own. The claim checker and its controls measured
    # 22s + 45s locally; adding them under a 30-minute cap would buy a gate at
    # the price of an intermittent red, which is the trade
    # docs/failure-modes.md says not to make.
    timeout-minutes: 40

    # Issue #422. On 2026-09-28 the `everything else` step below exited 139 --
    # SIGSEGV, core dumped -- 12m40s in, at 30 % collected, with the innermost
    # Python frame at model/drums_fx.py's `Env.out`:
    #
    #     return self.level >> (ENV_BITS - 15)
    #
    # A shift of two ints cannot fault, and the traceback's ~30 Python frames run
    # unbroken into pytest's runner, so it is neither our arithmetic nor runaway
    # recursion: the interpreter or a native extension died and surfaced at
    # whatever frame happened to be innermost. The SAME COMMIT passed this job on
    # its other trigger -- push 36377452558 crashed, pull_request 36377455006
    # passed -- so it is non-deterministic, established rather than assumed.
    #
    # The full measurement is docs/ci-segfault-2026-09-28.md. What is pinned here
    # does NOT claim to fix it -- nothing reproduced it in 120 runs -- and is
    # justified by two numbers rather than by plausibility:
    #
    #   - `tools/crash_rate.py --runs 60`, twice, on the exact failing nodeid and
    #     the exact stack that crashed (Python 3.12, numpy 2.5.3, scipy 1.18.1):
    #     0 crashes in 120 runs that reached the code. So the honest status is
    #     "bounded and instrumented", not "repaired", and the reason for pinning
    #     is the second number, not the first.
    #   - that same path takes the process from 1 OS thread to 15 under those pip
    #     wheels, and to 1 under Ubuntu's apt numpy. The thread count of a job
    #     that died in its main interpreter thread is therefore a function of the
    #     runner tier and of whatever pip resolved that morning, neither of which
    #     is in the commit. Pinning makes the numeric environment a property of
    #     the commit, which is what makes a future crash rate comparable at all.
    #     Cost, from the 60+60 paired runs under one load: median 12.86 s pinned
    #     against 13.26 s unpinned -- 3 % FASTER, because these are least-squares
    #     fits over a few hundred samples, where starting a thread pool costs
    #     more than it returns.
    #
    # Deliberately NOT applied to the other jobs in this file, which run the same
    # wheels unpinned. That leaves a control: a recurrence in `m5a-fast` or `rtl`
    # but never here is evidence about threading, and a recurrence in both is
    # evidence against it. Pinning everything would have destroyed the only
    # comparison this repository can run without reproducing the crash.
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          # check_stale_base compares against origin/main, and a merge-base
          # cannot be computed from a shallow single-branch clone. Without this
          # the step fails on every run -- which tools/check_workflows.py caught
          # in this very file, on its first outing.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install --upgrade pip numpy scipy pytest pyyaml

      # The checking machinery is the one artefact nothing checked, and four CI
      # defects landed in one session because of it. An unparseable workflow is
      # not a failed build -- GitHub silently does not register it, so it looks
      # exactly like one that passed.
      - name: the workflows themselves parse and can run
        run: python tools/check_workflows.py

      # The roadmap is compiled from evidence, not maintained by hand. This
      # document twice carried findings that had already been fixed -- the
      # modal_dp exc hazard, and red on four repaired drum circuits. --check
      # fails if README's diagram is out of date, or if any node is STALE:
      # a green claim whose evidence has gone out from under it.
      # The roadmap is compiled from evidence that is ACTUALLY EXECUTED here,
      # not from the presence of a file. An earlier version of this script
      # called a node green when its test file existed -- so a suite with every
      # assertion deleted would have rendered green, which is the exact failure
      # the tool exists to prevent.
      #
      # --run executes each fast node's suite and records pass/fail with the
      # commit. --check then fails if README disagrees, if a node is RED, or if
      # a node is STALE -- passed once, but a file it `covers` has changed
      # since, so the result no longer describes this code. Slow nodes
      # (iverilog, hours) carry their status from the nightly job.
      # On a PR branch the dag workflow does not run, so this is what keeps a
      # pull request honest about what it claims. On main the bot regenerates
      # and commits instead -- see .github/workflows/dag.yml.
      - name: the roadmap matches the evidence
        run: |
          python tools/compile_dag.py --run || true   # a RED node is a result
          python tools/compile_dag.py --check

      # First on purpose: every node above F1 measures with these estimators,
      # so a suite built on untested analysers measures the analysers.
      # Would merging this branch lose anything? Answered by MERGING it, not by
      # diffing -- inferring from `git diff main branch` (two-dot) produced
      # three false alarms, because everything main gained since the branch
      # point shows up there as a deletion.
      - name: the merge would not lose a file
        run: python tools/check_stale_base.py --base origin/main --head HEAD

      - name: F3 -- measurement ground truth
        run: python -m pytest model/test_audio_measure.py -q
      - name: M2 -- the voice is musically a Minimoog
        run: python -m pytest model/test_moog_acceptance.py -q
      # The two instruments issue #422 added live under tools/, which
      # `pytest model/ spec/` does not collect and which no job runs in full --
      # exactly the gap #390 found, where the SN tone-stage derivation was
      # carried by a file no workflow collected. Named here, and named BEFORE the
      # step it guards: tools/run_with_rss.py stands in front of the one step
      # that has already died of SIGSEGV, so an unexercised copy of it is a false
      # green waiting to happen. Its load-bearing control is a child that really
      # does segfault and must still exit 139 through the wrapper.
      # Measured 7.7 s + 8.3 s on the 8-vCPU worker, so the 40-minute cap above
      # is untouched.
      - name: the crash instruments' controls
        run: |
          python -m pytest tools/test_run_with_rss.py -q
          python -m pytest tools/test_crash_rate.py -q

      # Wrapped for issue #422. The crash could not be classified after the fact
      # because this job recorded neither peak RSS nor `ulimit -s`, and an OOM
      # kill (137) and a native fault (139) are different problems with different
      # fixes. The wrapper prints both, plus MemTotal/MemAvailable and which
      # thread limits are in force, BEFORE the command runs -- so the envelope
      # survives a child that takes the runner down with it -- and passes the
      # child's status through unchanged: a SIGSEGV still exits 139 here.
      # Measured on the 8-vCPU worker: 98 MB peak for the failing test alone and
      # 245 MB for this whole step, so on a runner with GB of headroom memory was
      # never near the edge, which is what makes 139 rather than 137 coherent.
      # The runner's OWN ulimit and MemTotal have never been recorded; the next
      # run of this job is the first that will print them.
      #
      # `--require-thread-pins` asserts the job-level env: block above is
      # actually in force, at the one step whose numeric environment it changes.
      # Measured (docs/ci-segfault-2026-09-28.md §2, replicated on a second
      # host): this path runs 15 OS threads unpinned and 1 pinned, and the two
      # logs are otherwise identical -- so a mitigation that silently stopped
      # applying (a renamed key, a step-level env: shadowing it, the job split in
      # two) would leave every future crash rate incomparable with no signal at
      # all. It refuses with 126 WITHOUT running the suite rather than measuring
      # an environment nobody checked; 126 and 127 are used because no pytest run
      # produces either. Both directions are controlled in
      # tools/test_run_with_rss.py, including that the refusal cannot launder a
      # SIGSEGV -- with the pin in force a segfaulting child still exits 139.
      - name: everything else
        run: >-
          python tools/run_with_rss.py --require-thread-pins --
          python -m pytest model/ spec/ -q

      # The claim checker gates prose against the tree, so it has to RUN on a
      # pull request or it gates nothing -- the list it was commissioned to fix
      # stayed wrong for a week because nothing was re-deriving it, and a gate
      # nothing invokes fails exactly the same way. Its own controls first: an
      # unexercised checker measures the checker, not the docs.
      - name: the claim checker's controls
        run: python -m pytest tools/test_check_doc_claims.py -q
      - name: documented claims match the evidence
        run: python tools/check_doc_claims.py

      # Same argument, one file over: the oscillator-1 Shape/Width table in
      # model/reference_rigs.py is a hand transcription of
      # docs/surge-waveform-mapping.txt, and that comment now says outright that
      # the two "cannot drift silently again". It could not say that while the
      # checker ran only under `make verify` (build box) and `make controls`
      # (not what nightly.yml's controls job invokes) -- a comment asserting an
      # enforcement no CI job performs is issue #271's own defect, one level up.
      # Controls first, for the reason above: an unexercised checker measures
      # the checker. Measured 0.72s + <0.1s, so the 40-minute cap and the
      # variance note at the top of this job are untouched.
      - name: the Shape/Width transcription checker's controls
        run: python -m pytest tools/test_check_surge_waveform_comment.py -q
      - name: the oscillator-1 comment still transcribes the sweep
        run: python tools/check_surge_waveform_comment.py

      # Decision-record numbering, and this one has to run ON THE PULL REQUEST
      # or it gates nothing: the next free DR number cannot be read off your own
      # branch, so two PRs each took 0017 within two minutes and both merges
      # were clean because the filenames differ (issue #250). The pull request is
      # the only place the collision is visible before it is on main. `make
      # verify` is invoked by no workflow, so the Makefile job alone would not
      # have caught either of the two collisions that shipped. Controls first,
      # same reason as above. Measured 0.9s + 0.05s.
      - name: the DR-numbering checker's controls
        run: python -m pytest tools/test_check_decision_record_numbers.py -q
      - name: every decision record owns its number
        run: python tools/check_decision_record_numbers.py

      # Same argument again, and #390 found it the hard way: the SN p.13 tone
      # stage's most structural claim ("five capacitors, no cap-only loop,
      # therefore fifth-order with ONE shared denominator") was carried by a
      # test file NO workflow collected. Not skipped -- absent. This job runs a
      # named list, `pytest tools/` in full runs only under `make verify` (which
      # no workflow invokes; rungs.yml runs `make verify-fast`), and docs/dag.json
      # has no node under tools/. Naming the two files here is what makes the
      # question "does this check run in CI, or only on a build box?" answer YES
      # for them. The `sympy` witness inside the first file still skips, because
      # sympy is deliberately not installed above -- but it is now a visible skip
      # BESIDE two numpy-only witnesses of the same fact that do run, rather than
      # the sole evidence in a file nothing collected.
      # Measured 4.0 s + 2.3 s, so the 40-minute cap above is untouched. Neither
      # needs the network: the ~6 MB SN scan is not a test dependency (the tests
      # cover the refusal paths), and the digitised Figure 9 evidence artifact is
      # committed.
      - name: the SN p.13 tone-stage derivation and its controls
        run: python -m pytest tools/test_tone_stage_schematic.py -q
      - name: the Figure 9 digitiser and its controls
        run: python -m pytest tools/test_werner_fig9.py -q
      # Same argument a third time (#369 step 9). The TONE knob law's headline
      # property runs off the COMMITTED docs/scorecard/cymbal-369/fischer.json,
      # so the 25 measurements it is judged against are here even though the
      # ~30 MB corpus is not: 9 tests and parametrised cases that need the WAVs
      # skip visibly, and the two corpus-gated controls report NO VERDICT.
      #
      # NO VERDICT is not a pass, but be exact about what this job does with
      # it: BOTH steps below exit 0 with those two controls undecided. They are
      # enforced by `make reference-integration`, which runs the same file with
      # GF180_REQUIRE_TR808_REFS=1 and the same tool with --require-corpus, on
      # the box that has the corpus. This job is the part of the argument that
      # can be made without 30 MB of WAVs -- all 25 settings in the 1 s window,
      # and 5 of the 7 injected defects -- and not all of it.
      #
      # Measured on the 8-vCPU worker: 31 s / 4.8 s here without the corpus,
      # 45 s / 9.2 s with it.
      - name: the VR4 TONE knob law and its controls
        run: python -m pytest tools/test_cymbal_tone_knob.py -q
      - name: the TONE knob gate itself, as the tool issues it
        run: python tools/cymbal_tone_knob.py --check

      # A green run must be capable of being red -- and this control has to
      # test the SUITE, not the Python parser. An earlier version of this file
      # renamed a parameter into `def rms(_unused=None, x)`, which is a syntax
      # error: the module failed to import, pytest exited nonzero, and the
      # control "passed" having proved only that Python rejects bad syntax.
      # That is the same vacuous-control mistake PR #5 was opened to fix.
      #
      # So: each mutation must still COMPILE and still IMPORT, and only then is
      # a failure evidence that the suite detects wrong arithmetic.
      - name: the suite detects wrong arithmetic, not just bad syntax
        run: |
          python - <<'PY'
          import importlib, pathlib, subprocess, sys
          p = pathlib.Path("model/audio_measure.py")
          orig = p.read_text()
          # (label, exact source to replace, replacement) -- each is valid
          # Python that returns a numerically wrong answer.
          MUTANTS = [
              ("rms inflated 5 %",
               "return float(np.sqrt(np.mean(x * x))) if len(x) else 0.0",
               "return float(np.sqrt(np.mean(x * x)) * 1.05) if len(x) else 0.0"),
              ("T20 conversion off by 10 %",
               "return TAU_TO_T20 * tau_s",
               "return TAU_TO_T20 * tau_s * 1.10"),
          ]
          failures = []
          for label, old, new in MUTANTS:
              if old not in orig:
                  failures.append(f"{label}: anchor text not found -- control is stale")
                  continue
              p.write_text(orig.replace(old, new, 1))
              try:
                  # 1. it must still be valid Python ...
                  compile(p.read_text(), str(p), "exec")
                  # 2. ... and must still import, or we are testing the parser
                  r = subprocess.run([sys.executable, "-c",
                                      "import sys; sys.path.insert(0,'model'); import audio_measure"],
                                     capture_output=True)
                  if r.returncode != 0:
                      failures.append(f"{label}: mutant does not import -- tests the parser, not the suite")
                      continue
                  # 3. ... and NOW the suite must notice the wrong number.
                  r = subprocess.run([sys.executable, "-m", "pytest",
                                      "model/test_audio_measure.py", "-q"],
                                     capture_output=True)
                  if r.returncode == 0:
                      failures.append(f"{label}: suite passed with wrong arithmetic")
                  else:
                      print(f"  caught: {label}")
              finally:
                  p.write_text(orig)
          if failures:
              sys.exit("negative control failed:\n  " + "\n  ".join(failures))
          print("negative control OK -- wrong arithmetic turns the suite red")
          PY

  # RTL bit-exactness. Separate job because iverilog is slow: the ladder is
  # ~1 min, the full voice is ~20 and does not belong on every push.
  rtl:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install --upgrade pip numpy scipy pytest
      - run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: F1 -- ladder bit-exact
        run: python rtl-sketch/verify_ladder.py
      - name: M1 -- selected 2x Moog voice bit-exact (quick set)
        run: python rtl-sketch/verify_voice.py --set quick --osc2x --outdir build/voice-osc2x
      - name: M1b -- reconstructed 2x filter and measured pulse-duty challenger
        run: python rtl-sketch/verify_voice.py --set quick --only waves3 --filter2x --outdir build/voice-filter2x

      # The integration checks. These are the ones that matter most and were
      # the last to reach CI: every block in this design was bit-exact against
      # its model while the control link silently delivered 37 of 155 register
      # writes, because every bench drove the register write port rather than
      # the link. Block-level green is not integration green.
      - name: F2 -- modal bank bit-exact
        run: python rtl-sketch/verify_modal.py
      - name: I2 -- the control link carries every register write
        run: python rtl-sketch/verify_ctl.py
      - name: I4 -- selected 2x path at the pins, SPI in to I2S out
        run: python rtl-sketch/verify_synth_top.py --osc2x
      - name: I4b -- reconstructed filter candidate through SPI to I2S
        run: python rtl-sketch/verify_synth_top.py --m5a-smoke --filter2x --outdir build/top-m5a-filter2x

      # Each integration check carries a control that must turn it red. The
      # SPI_ADDR7 mutant reinstates the rev-1 seven-bit address field -- the
      # exact defect that shipped -- so it can never return silently.
      - name: the integration checks can still fail
        run: |
          python rtl-sketch/verify_ctl.py --inject SPI_ADDR7 --expect-fail
          python rtl-sketch/verify_ctl.py --inject SPI_DATA24 --expect-fail
          python rtl-sketch/verify_synth_top.py --inject VOICE_MASTER_PRESHIFT --expect-fail
          python rtl-sketch/verify_synth_top.py --inject I2S_SHIFT --expect-fail
      - name: the selected 2x path and integration reject disabling mutations
        run: |
          python rtl-sketch/verify_voice.py --set quick --only default --osc2x --inject OSC2X_OFF --expect-fail --outdir build/voice-osc2x-control
          python rtl-sketch/verify_synth_top.py --osc2x --inject VOICE_OSC2X_OFF --expect-fail --outdir build/top-osc2x-control
          python rtl-sketch/verify_synth_top.py --m5a-smoke --filter2x --inject VOICE_FILTER2X_OFF --expect-fail --outdir build/top-filter2x-control

  # The full 255,060-frame voice run and the drum runs, on demand and nightly
  # rather than per push.
  rtl-full:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install --upgrade pip numpy scipy pytest
      - run: sudo apt-get update && sudo apt-get install -y iverilog verilator
      - name: M1 -- one Moog voice bit-exact (full)
        run: python rtl-sketch/verify_voice.py --set full
      - name: D -- the eight-stop drum kit bit-exact
        run: python rtl-sketch/verify_drums.py
      - name: M5A -- complete reconstructed 2x filter phrase through SPI to I2S and score decoded audio
        run: python tools/verify_m5a_filter2x_i2s.py
      - name: M5A -- Verilator integrated disabling control
        run: python rtl-sketch/verify_synth_top.py --simulator verilator --m5a-smoke --filter2x --inject VOICE_FILTER2X_OFF --expect-fail --outdir build/top-filter2x-verilator-control
