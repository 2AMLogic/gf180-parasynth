name: PR 1220 isolated Verilator smoke pair
'on':
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  rtl-full:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        ref: d004dc8ae08dfb672ebc120e2efe55c511b2a1e8
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: python -m pip install --upgrade pip numpy scipy pytest
    - run: sudo apt-get update && sudo apt-get install -y iverilog verilator
    - name: Record runner and source
      run: git rev-parse HEAD && verilator --version
    - name: M5A -- clean Verilator smoke baseline for the disabling control
      run: python rtl-sketch/verify_synth_top.py --simulator verilator --m5a-smoke
        --filter2x --outdir build/top-clean-m5a-f2x-verilator
    - name: M5A -- Verilator integrated disabling control
      run: python rtl-sketch/verify_synth_top.py --simulator verilator --m5a-smoke
        --filter2x --inject VOICE_FILTER2X_OFF --expect-fail --outdir build/top-filter2x-verilator-control
