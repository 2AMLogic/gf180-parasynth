; Issue #564. The suites are collected by DIRECTORY (Makefile `verify`,
; `verify-full`, `test`; CI `pytest model/ spec/` and `pytest tools/`), so a
; module whose tests pytest does not collect by name never runs anywhere.
; The four modules below carry in-file tests (57 on first collection) and keep
; their names because docs and commits cite them. pytest's two default patterns
; are restated first: setting python_files REPLACES the default, it does not
; extend it.
;
; Do NOT widen this to `*.py`: that imports every executable probe.
; tools/pytest_collection_inventory.py (run by tools/test_pytest_collection_inventory.py)
; fails if any defined test under model/ spec/ tools/ fpga/ pnr/ is not collected.
[pytest]
python_files =
    test_*.py
    *_test.py
    excitation_energy.py
    dc_blocker.py
    discrimination_features.py
    discrimination_trajectory.py
